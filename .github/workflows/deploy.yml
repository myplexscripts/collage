name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # the repo's Pages was originally enabled in "deploy from branch" mode,
      # which races this workflow and publishes the raw source over the build;
      # flip the source to GitHub Actions so legacy builds stop triggering
      - name: Ensure Pages source is GitHub Actions
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
            || echo "::warning::Could not switch Pages source automatically — set Settings → Pages → Source to 'GitHub Actions'"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # if Pages is still in "deploy from branch" mode, GitHub's legacy build
      # races this workflow on every push and republishes the raw source over
      # our deployment; wait it out so our deploy always lands last and wins
      - name: Wait for legacy Pages build to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            busy=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50" \
              | jq '[.workflow_runs[] | select((.path | startswith("dynamic/pages")) and (.status != "completed"))] | length')
            if [ "$busy" = "0" ]; then
              echo "No legacy Pages build running."
              break
            fi
            echo "Legacy Pages build still running, waiting... ($i)"
            sleep 10
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
